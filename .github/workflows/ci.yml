name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - sprint_1
      - 'ai-fix/**'
  pull_request:
    branches:
      - main
      - sprint_1

jobs:
  frontend-ci:
    name: Frontend Quality & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code (ESLint)
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Build Production Bundle
        run: npm run build

  backend-ci:
    name: Backend Lint & Sanity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax & Import Check
        run: |
          python -m py_compile app/main.py app/config.py
          python -c "from app.domain import TaskCreate, TaskRecord, PatchAction, PatchSet; print('Domain models validated successfully!')"
